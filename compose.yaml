services:
  db:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: photo
      POSTGRES_DB: photo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - photo-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photo -d photo']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  photo-db:
