name: review-pages

on:
  workflow_run:
    workflows: [review-build]
    types: [completed]
  # close時は信頼するmainだけをcheckoutし、PRのコードは実行しない。
  pull_request_target:
    types: [closed]

permissions: {}

# Pages全体と保存用ブランチを同時更新しない。
concurrency:
  group: review-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check PR and current commit
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const closing = context.eventName === 'pull_request_target';
            const run = context.payload.workflow_run;
            const number = closing ? context.payload.pull_request.number : run.pull_requests?.[0]?.number;
            if (!Number.isSafeInteger(number)) throw new Error('PR could not be identified');
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) throw new Error('Fork previews are not published');
            if (!closing && (pr.state !== 'open' || pr.head.sha !== run.head_sha)) {
              core.notice('Skipping a closed PR or outdated build');
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('number', number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('remove', closing ? 'true' : 'false');
      - uses: actions/download-artifact@v4
        if: steps.target.outputs.skip != 'true' && steps.target.outputs.remove != 'true'
        with:
          name: review-site
          path: work/incoming
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare Pages content from validated data
        if: steps.target.outputs.skip != 'true'
        env:
          PREVIEW_NUMBER: ${{ steps.target.outputs.number }}
          PREVIEW_SHA: ${{ steps.target.outputs.sha }}
          PREVIEW_REMOVE: ${{ steps.target.outputs.remove }}
        run: node scripts/prepare-review-pages.mjs
      - uses: actions/configure-pages@v5
        if: steps.target.outputs.skip != 'true'
        id: pages
      - uses: actions/upload-pages-artifact@v3
        if: steps.target.outputs.skip != 'true'
        with:
          path: work/pages
      - uses: actions/deploy-pages@v4
        if: steps.target.outputs.skip != 'true'
        id: deploy
      - name: Record review links on the PR
        if: steps.target.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_NUMBER: ${{ steps.target.outputs.number }}
          PREVIEW_SHA: ${{ steps.target.outputs.sha }}
          PREVIEW_REMOVE: ${{ steps.target.outputs.remove }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = Number(process.env.PREVIEW_NUMBER);
            const marker = '<!-- review-pages -->';
            const root = `${process.env.PAGES_URL.replace(/\/$/, '')}/pr/${number}/`;
            const body = process.env.PREVIEW_REMOVE === 'true'
              ? `${marker}\nPRがcloseされたためレビュー用ページを削除しました。`
              : `${marker}\n## レビュー用ページ\n\n対象コミット: \`${process.env.PREVIEW_SHA}\`\n\n- [トップ](${root})\n- [Storybook](${root}storybook/)\n- [OpenAPI / Swagger UI](${root}api/)\n\n提案の閲覧用です。仕様の承認・製品の実装完了を意味しません。`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
