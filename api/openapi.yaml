openapi: 3.1.0
info:
  title: photo-server API
  version: 0.1.0-draft
  description:
    'POレビュー用の初期契約案。API全体の承認と実装は未実施。元ファイル・撮影日時・位置情報の保持方針は製品仕様第4節に従い承認済み。製品仕様の写真追加・閲覧・ダウンロード・削除を対象とする。全操作はTailscale内の許可された2人だけが利用でき、権限は同一。アルバム・タグ・編集・登録・公開リンクは対象外。
    更新操作は同一オリジンに限定し、サーバーでCSRFを検証する。写真・利用者情報・エラー応答にはCache-Control: private, no-storeを付ける。APIは認証エラー時にHTMLログインへリダイレクトしない。'
servers:
  - url: /api/v1
    description: 同一オリジンのAPIベースパス案
tags:
  - name: Identity
  - name: Photos
security:
  - tailscaleIdentity: []
x-review-status: proposed
x-pending-decisions:
  - Tailscale Serveの利用者識別方法、信頼境界とCSRF方式の確定。
  - 許可形式、容量制限。
  - 削除・復元・物理消去・バックアップの保持方針。
  - 本案のページング、1件ずつのアップロード、サムネイルJPEGの承認。
paths:
  /me:
    get:
      operationId: getCurrentUser
      tags:
        - Identity
      summary: 許可済みの現在の利用者を取得
      responses:
        '200':
          description: 認証・許可ID照合に成功した利用者。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': &id001
          $ref: '#/components/responses/Error401'
        '403': &id002
          $ref: '#/components/responses/Error403'
        '500': &id003
          $ref: '#/components/responses/Error500'
        '503': &id004
          $ref: '#/components/responses/Error503'
  /photos:
    get:
      operationId: listPhotos
      tags:
        - Photos
      summary: 共有写真の一覧を取得
      responses:
        '200':
          description: 保存が完了した写真のみ。0件時はitemsが空配列。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '401': *id001
        '403': *id002
        '500': *id003
        '503': *id004
        '400': &id005
          $ref: '#/components/responses/Error400'
      description: createdAt降順、同時刻はid降順。カーソルはこの順序の継続位置を表す。後から追加された写真は先頭を再取得して表示する。削除によりページが短くなる場合がある。無効なカーソルは400。
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
          description: 直前のnextCursorを変更せず指定する。
    post:
      operationId: uploadPhoto
      tags:
        - Photos
      summary: 写真を1件アップロード
      responses:
        '201':
          description: 元ファイルの永続保存とメタデータ登録が完了。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
          headers:
            Location:
              description: 作成した写真の詳細APIパス。
              schema:
                type: string
                format: uri-reference
        '401': *id001
        '403': *id002
        '500': *id003
        '503': *id004
        '400': *id005
        '409': &id007
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
      description: 1リクエスト1ファイル。一括UIは個別に呼び出し各結果を表示する。実データと形式を検証し、不完全な保存を成功扱いしない。許可形式・容量制限はPO確認後に確定する。元ファイルはEXIFを含め変更せず保持する。撮影日時・GPSは内部保存のみで初期レスポンスには含めない。メタデータ解析の失敗だけではアップロードを失敗させない。応答喪失後の再送は重複登録の可能性があり、自動再送は行わない。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: 元ファイル。ファイル名を保存パスに使用しない。
              required:
                - file
  /photos/{photoId}:
    parameters:
      - &id008
        name: photoId
        in: path
        required: true
        schema: &id010
          type: string
          format: uuid
    get:
      operationId: getPhoto
      tags:
        - Photos
      summary: 写真の詳細情報を取得
      responses:
        '200':
          description: 写真の基本情報。EXIF・位置情報は返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '401': *id001
        '403': *id002
        '500': *id003
        '503': *id004
        '400': *id005
        '404': &id006
          $ref: '#/components/responses/Error404'
    delete:
      operationId: deletePhoto
      tags:
        - Photos
      summary: 確認済みの写真を削除
      responses:
        '204':
          description: 一覧・詳細・元画像・サムネイルから参照できなくなった。
        '401': *id001
        '403': *id002
        '500': *id003
        '503': *id004
        '400': *id005
        '404': *id006
        '409': *id007
      description: 画面で対象を確認してから呼び出す。アップロード者によらず2人とも実行可能。削除済み・不存在は404。ゴミ箱・復元・物理削除時期・バックアップとの関係は未決であり、承認までは実装しない。204は物理消去の完了を保証しない。
  /photos/{photoId}/original:
    parameters:
      - *id008
    get:
      operationId: downloadPhotoOriginal
      tags:
        - Photos
      summary: 元ファイルをダウンロード
      responses:
        '200':
          description: アップロード時と同一のバイト列。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema: &id009
                type: string
              description: private, no-storeを返す。
            Content-Disposition:
              schema: *id009
              description: attachment。元の名前は安全にエスケープしてfilename*に設定する。
        '401': *id001
        '403': *id002
        '500': *id003
        '503': *id004
        '400': *id005
        '404': *id006
      description: 取得ごとに認証・認可する。公開URLや外部ストレージへのリダイレクトは返さない。
  /photos/{photoId}/thumbnail:
    parameters:
      - *id008
    get:
      operationId: getPhotoThumbnail
      tags:
        - Photos
      summary: サムネイルを取得
      responses:
        '200':
          description: EXIF・GPSなどのメタデータを除去した生成済みサムネイル。生成中・一時的失敗は503とRetry-Afterを返す。
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema: *id009
              description: private, no-storeを返す。
        '401': *id001
        '403': *id002
        '500': *id003
        '503': *id004
        '400': *id005
        '404': *id006
      description: 取得ごとに認証・認可する。公開URLや外部ストレージへのリダイレクトは返さない。
components:
  securitySchemes:
    tailscaleIdentity:
      type: http
      scheme: tailscale
      description: Tailscaleの信頼する入口での認証とアプリの許可ID照合を表すカスタム方式。Authorizationヘッダーを送る方式ではない。クライアント指定の利用者ヘッダーを認証として信用しない。実際の入口・CSRF・セッション方式は未決。コード生成器による自動認証は対象外。
  schemas:
    Photo:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        filename:
          type: string
          minLength: 1
        mediaType: *id009
        sizeBytes:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - filename
        - mediaType
        - sizeBytes
        - createdAt
    PhotoPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        nextCursor:
          type:
            - string
            - 'null'
          description: 次ページの不透明カーソル。末尾はnull。
      required:
        - items
        - nextCursor
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
      required:
        - id
        - displayName
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
      required:
        - code
        - message
        - requestId
  responses:
    Error400:
      description: 入力・カーソル・UUIDが不正。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 信頼する入口で利用者を識別できない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: 未許可ID・機械用ID、またはCSRF検証失敗。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: 写真が存在しない、または削除済み。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 写真の状態が操作と競合。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: アップロード容量超過。上限値は未決。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: 未対応のファイル形式。許可形式は未決。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: ファイルが破損、空、または実データが宣言形式と不一致。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: 予期しない内部エラー。内部パスや秘密情報は返さない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: 保存領域などが一時的に利用できない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 再試行までの秒数。サムネイル生成待ちでは必須。
