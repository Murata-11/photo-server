{
  "openapi": "3.1.0",
  "info": {
    "title": "Photo UI prototype API — proposal only",
    "version": "0.1.0"
  },
  "paths": {
    "/api/photos": {
      "get": {
        "operationId": "listPhotos",
        "responses": {
          "200": {
            "description": "Prototype success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Photo"
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "404": {
            "description": "Photo not found"
          }
        }
      },
      "post": {
        "operationId": "createPhoto",
        "responses": {
          "200": {
            "description": "Prototype success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Photo"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "404": {
            "description": "Photo not found"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "src",
                  "name"
                ],
                "properties": {
                  "src": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/photos/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "patch": {
        "operationId": "updatePhoto",
        "responses": {
          "200": {
            "description": "Prototype success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Photo"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input"
          },
          "404": {
            "description": "Photo not found"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "favorite": {
                    "type": "boolean"
                  },
                  "deleted": {
                    "type": "boolean"
                  },
                  "album": {
                    "type": "string"
                  }
                },
                "additionalProperties": false
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Photo": {
        "type": "object",
        "required": [
          "id",
          "src",
          "name",
          "date",
          "location",
          "favorite",
          "deleted",
          "album"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "src": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "date": {
            "type": "string"
          },
          "location": {
            "type": "string"
          },
          "favorite": {
            "type": "boolean"
          },
          "deleted": {
            "type": "boolean"
          },
          "album": {
            "type": "string"
          }
        }
      }
    }
  }
}
